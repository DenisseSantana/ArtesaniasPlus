<script>
const SIN='Sin registrar',L=a=>a.split('|'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEC=[['info','Información general'],['pago','Pagos'],['dir','Direcciones'],['env','Envíos'],['rec','Recepción'],['rcl','Reclamos'],['reg','Regalos']];
const D=[['id','ID Pedido','t','info'],['fecha','Fecha','d','info'],['cliente','Cliente','t','info'],['producto','Producto','t','info'],['monto','Monto USD','n','info'],['estadoOrig','Estado original','t','info'],['notas','Notas','a','info'],['estado','Estado operativo','s','info',L('Sin registrar|Nuevo|Confirmado|En preparación|Finalizado|Cancelado')],
['pFecha','Fecha de pago','d','pago'],['pMedio','Medio de pago','s','pago',L('Sin registrar|PayPal|Mercado Pago')],['pTx','ID de transacción','t','pago'],['pMonto','Monto pagado','n','pago'],['pEstado','Estado de pago','s','pago',L('Sin registrar|Pendiente de pago|Pago reportado|En verificación|Pago parcial|Pagado|Pago rechazado|Reembolsado')],
['dNom','Nombre del destinatario','t','dir'],['dTel','Teléfono','t','dir'],['dCalle','Calle y número','t','dir'],['dCol','Colonia','t','dir'],['dCiudad','Ciudad','t','dir'],['dEdo','Estado o provincia','t','dir'],['dCp','Código postal','t','dir'],['dPais','País','t','dir'],['dRef','Referencias','a','dir'],
['eTipo','Tipo de envío','s','env',L('Sin registrar|Paquetería|Servicio postal|Mensajería local|Entrega personal|Recolección en tienda')],['eEmp','Empresa u operador','t','env',0,1],['eProv','Proveedor de envío','t','env'],['eFecha','Fecha de envío','d','env'],['eGuia','Número de guía','t','env'],['eLink','Enlace de rastreo','t','env'],['eEntr','Fecha estimada de entrega','d','env'],['eEstado','Estado de envío','s','env',L('Sin registrar|No preparado|En preparación|Listo para envío|Enviado|En tránsito|Incidencia|Devuelto|No aplica')],
['rFecha','Fecha de recepción','d','rec'],['rEstado','Estado de recepción','s','rec',L('Sin registrar|Pendiente de entrega|Entregado sin confirmar|Recibido y confirmado|Entrega fallida|Rechazado por destinatario|Devuelto al remitente')],
['cTipo','Tipo de reclamo','t','rcl'],['cDesc','Descripción','a','rcl'],['cFecha','Fecha de apertura','d','rcl'],['cEstado','Estado del reclamo','s','rcl',L('Sin reclamo|Abierto|En revisión|Esperando respuesta|Resuelto|Cerrado')],['cRes','Fecha de resolución','d','rcl'],
['gEs','¿Es regalo?','s','reg',L('Sí|No|Sin registrar')],['gMsg','Mensaje personalizado','a','reg']
].map(([id,label,type,sec,opts,cond])=>({id,label,type,sec,opts,cond,vis:true}));
const COND=['Paquetería','Servicio postal','Mensajería local'];
let O=[],P={f:D,secs:Object.fromEntries(SEC.map(s=>[s[0],true]))},flt={q:'',c:'',e:''},cur=-1;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};

O=ld('ap_o',[]);P=ld('ap_p',P);D.forEach(d=>{if(!P.f.find(f=>f.id===d.id))P.f.push(d)});
const fd=id=>P.f.find(f=>f.id===id);
const val=(o,id)=>{const f=fd(id),v=o.v[id];return f&&f.type==='s'?(v||f.opts[0]):(v??'')};
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
function cls(o){
 const g=i=>val(o,i),A=new Set,I=[],est=g('estado'),pe=g('pEstado'),ee=g('eEstado'),re=g('rEstado'),ce=g('cEstado'),et=g('eTipo');
 const open=['Abierto','En revisión','Esperando respuesta'].includes(ce),m=parseFloat(g('monto')),pm=parseFloat(g('pMonto'));
 if(est==='Cancelado'&&!open)return{c:'none',A:[],I:[]};
 if(!g('cliente'))I.push('Falta el cliente');
 if(!(m>0))I.push('Falta un monto válido');
 if(pe==='Pagado'&&pm>0&&m>0&&pm<m)I.push('Pagado, pero el monto pagado es menor al total');
 if(pe==='Pago parcial'&&pm>0&&m>0&&pm>=m)I.push('Pago parcial con monto completo');
 if(re==='Recibido y confirmado'&&pe!=='Pagado')I.push('Recibido, pero el pago no está confirmado');
 if(est==='Finalizado'&&['Pendiente de pago','Pago rechazado','Reembolsado'].includes(pe))I.push('Finalizado con pago '+pe.toLowerCase());
 if(['Enviado','En tránsito'].includes(ee)&&['Paquetería','Servicio postal'].includes(et)&&!g('eGuia'))I.push('Enviado sin número de guía');
 if(['Recibido y confirmado','Entregado sin confirmar'].includes(re)&&['No preparado','En preparación'].includes(ee))I.push('Entrega registrada sin envío realizado');
 if(ee==='Listo para envío'&&COND.includes(et)&&!(g('dCalle')&&g('dCiudad')))I.push('Listo para envío sin dirección completa');
 ({'Pendiente de pago':'Cobrar pago','Pago reportado':'Verificar pago','En verificación':'Verificar pago','Pago parcial':'Cobrar saldo','Pago rechazado':'Contactar por pago rechazado'})[pe]&&A.add(({'Pendiente de pago':'Cobrar pago','Pago reportado':'Verificar pago','En verificación':'Verificar pago','Pago parcial':'Cobrar saldo','Pago rechazado':'Contactar por pago rechazado'})[pe]);
 if(open)A.add('Atender reclamo ('+ce.toLowerCase()+')');
 if(ee==='Incidencia')A.add('Resolver incidencia de envío');
 if(ee==='Devuelto')A.add('Gestionar devolución');
 if(['Entrega fallida','Rechazado por destinatario','Devuelto al remitente'].includes(re))A.add('Reprogramar entrega');
 if(re==='Entregado sin confirmar')A.add('Confirmar recepción con el cliente');
 if(ee==='Listo para envío'&&!I.length)A.add('Despachar pedido');
 if(['Enviado','En tránsito'].includes(ee))A.add('Dar seguimiento al envío');
 if(ee==='En preparación'||est==='En preparación')A.add('Preparar pedido'+(g('gEs')==='Sí'?' con envoltura de regalo':''));
 if(['Nuevo',SIN].includes(est))A.add('Confirmar pedido');
 if(est==='Confirmado'&&!A.size)A.add('Iniciar preparación');
 if(!I.length&&pe==='Pagado'&&re==='Recibido y confirmado'&&!open)return{c:'ok',A:[],I};
 if(!A.size&&!I.length)A.add(est==='Finalizado'?'Confirmar recepción con el cliente':'Revisar pedido');
 return{c:I.length?'ver':'proc',A:[...A],I};
}
const NM={proc:'En proceso',ver:'Por verificar',ok:'Completo',none:'Cancelado'},EM={proc:'🟠',ver:'🔴',ok:'🟢'};
const money=n=>'$'+(+n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});

 const C=O.map(cls),n=c=>C.filter(x=>x.c===c).length;

 $('#app').innerHTML=`<header><div><h1>ArtesaníasPlus</h1><p>Pedidos de Rosa · ${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</p></div>
 <div class="bar"><button class="b p" data-a="imp">Importar Excel/CSV</button><button class="b p" data-a="rep">Generar reporte diario</button><button class="b" data-a="exp">Exportar</button><button class="b" data-a="new">+ Pedido</button><button class="b" data-a="cfg">Campos</button></div></header>
